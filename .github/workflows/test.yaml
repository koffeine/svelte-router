name: Test
on: [ push, pull_request, workflow_dispatch ]
jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - uses: actions/setup-node@v7
            with:
                node-version: 26
          - run: npm ci
          - run: npm run init
          - run: npm test
